<meta name="ccb-kit" content="1">
<style>
  html, body { margin:0; background:transparent; }
  html[data-surface="board"], html[data-surface="board"] body, html[data-surface="board"] #app { height:100%; }
  .cb-card { --ccb-pad:12px; }
  html[data-surface="board"] .cb-card { height:100%; }
  .cb, .cb * { box-sizing:border-box; }
  .cb { display:flex; flex-direction:column; gap:10px; flex:1; min-width:0; min-height:0; color:var(--text); font:13px/1.4 -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:8px; flex:none; flex-wrap:nowrap; padding-right:44px; }
  .ttl { font-weight:600; font-size:14px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ttl small { color:var(--muted); font-weight:500; font-size:inherit; margin-left:6px; }
  .seg { position:relative; display:grid; grid-template-columns:repeat(3,1fr); flex:none; height:24px; background:color-mix(in srgb, var(--text) 7%, transparent); border-radius:999px; padding:2px; --i:0; }
  .seg::before { content:""; position:absolute; top:2px; bottom:2px; left:2px; width:calc((100% - 4px)/3); border-radius:999px; background:color-mix(in srgb, var(--blue) 22%, transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--blue) 35%, transparent); transform:translateX(calc(var(--i)*100%)); transition:transform .22s cubic-bezier(.3,.8,.3,1); }
  .seg button { all:unset; position:relative; box-sizing:border-box; min-width:38px; padding:0 9px; display:flex; align-items:center; justify-content:center; border-radius:999px; color:var(--muted); font-size:11px; line-height:1; cursor:pointer; transition:color .15s; }
  .seg button:hover { color:var(--text); }
  .seg button:focus-visible { outline:2px solid var(--blue); }
  .seg button.on { color:var(--text); font-weight:600; }
  .seg.off { opacity:.5; }
  .seg button:disabled { cursor:default; color:var(--muted); }
  .sum { display:flex; align-items:flex-end; gap:16px; flex:none; flex-wrap:wrap; }
  .big { font-size:34px; font-weight:700; line-height:1; letter-spacing:-.5px; font-variant-numeric:tabular-nums; }
  .big small { display:block; font-size:11px; font-weight:400; color:var(--muted); letter-spacing:0; margin-top:4px; }
  .lines { display:flex; flex-direction:column; gap:2px; font-variant-numeric:tabular-nums; }
  .lines b { font-weight:600; }
  .a { color:var(--green); }
  .d { color:var(--error); }
  .lbl { color:var(--muted); font-size:11px; }
  .trend { margin-left:auto; display:flex; align-items:flex-end; gap:2px; height:32px; min-width:60px; flex:0 1 150px; }
  .trend i { flex:1; background:var(--blue); opacity:.75; border-radius:2px 2px 0 0; min-height:2px; }
  .trend i.z { background:color-mix(in srgb, var(--text) 8%, transparent); opacity:1; }
  .list { display:flex; flex-direction:column; gap:8px; min-height:0; flex:1; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  .row { display:grid; grid-template-columns:20px minmax(0,1fr) auto; gap:2px 8px; align-items:center; flex:none; }
  .rk { color:var(--muted); font-size:12px; text-align:center; font-variant-numeric:tabular-nums; }
  .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
  .st { font-size:12px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .bar { grid-column:2/4; height:5px; border-radius:3px; background:color-mix(in srgb, var(--text) 8%, transparent); overflow:hidden; display:flex; }
  .bar i { display:block; height:100%; }
  .bar .ba { background:var(--green); }
  .bar .bd { background:var(--error); }
  .empty { color:var(--muted); padding:10px 0; }
  .un { display:flex; align-items:center; gap:12px; flex:1; min-height:0; padding:4px 0; }
  .uic { flex:none; width:40px; height:40px; border-radius:50%; background:color-mix(in srgb, var(--orange) 12%, transparent); color:var(--orange-text); box-shadow:inset 0 0 0 1.5px var(--orange-text); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; line-height:1; }
  .utx { min-width:0; max-width:100%; display:flex; flex-direction:column; gap:3px; }
  .uh { font-size:22px; font-weight:700; line-height:1.1; color:var(--orange-text); letter-spacing:-.2px; }
  .us { color:var(--text); font-weight:500; overflow-wrap:anywhere; }
  .ud { color:var(--muted); font-size:12px; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow-wrap:anywhere; }
  /* medium-short: drop the trend, fewer authors */
  @container ccb (max-height: 300px) { .trend { display:none; } .row:nth-child(n+5) { display:none; } .cb { gap:6px; } }
  @container ccb (max-height: 230px) { .ud { -webkit-line-clamp:1; } .row:nth-child(n+3) { display:none; } .big { font-size:28px; } }
  /* tiny: the commit count and the period toggle */
  @container ccb (max-height: 190px) {
    .us, .ud { display:none; } .uh { font-size:20px; } .uic { width:32px; height:32px; font-size:18px; }
    .list, .lines, .ttl { display:none; } .cb { gap:4px; } .cb-card { --ccb-pad:10px; }
    .big { font-size:26px; } .big small { margin-top:2px; } .top { justify-content:flex-start; }
  }
  @container ccb (max-width: 260px) { .ttl { display:none; } .seg button { min-width:30px; padding:0 6px; } .trend { display:none; } .row { grid-template-columns:16px minmax(0,1fr) auto; } .big { font-size:28px; } }
  @container ccb (max-width: 200px) { .st .cm { display:none; } .un { flex-direction:column; align-items:flex-start; justify-content:center; gap:6px; } .uic { width:28px; height:28px; font-size:16px; } .uh { font-size:19px; overflow-wrap:anywhere; } }
  @container ccb (min-height: 420px) { .list { gap:11px; } .big { font-size:40px; } }
  @media (prefers-reduced-motion: reduce) { .seg::before, .seg button { transition:none; } }
</style>
<div id="app"></div>
<script>
const { html, render, useState, useEffect, useLayoutEffect, useMemo, useRef, Card } = ccb.kit;

const KEYS = ['day', 'week', 'month'];
const NAMES = { day: 'Day', week: 'Week', month: 'Month' };
const SUB = { day: 'today', week: 'last 7 days', month: 'last 30 days' };
const STORE = 'ccb-contrib-period';

function fmt(n) {
  n = +n || 0;
  return n >= 10000 ? (n / 1000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, '') + 'k' : String(n);
}
function norm(d) {
  if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) { d = null; } }
  return d && typeof d === 'object' && !Array.isArray(d) ? d : {};
}
const isObj = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
const isNum = (v) => typeof v === 'number' && isFinite(v) && v >= 0;

/* A period counts as read only when its shape is complete; anything else is "unavailable", never a zero. */
function readPeriod(ps) {
  if (!isObj(ps) || !Array.isArray(ps.authors)) return null;
  let au = ps.authors;
  for (const a of au) if (!isObj(a) || typeof a.name !== 'string' || !isNum(a.commits) || !isNum(a.added) || !isNum(a.deleted)) return null;
  let t = ps.totals;
  if (t != null) {
    if (!isObj(t)) return null;
    for (const k of ['commits', 'added', 'deleted']) if (t[k] != null && !isNum(t[k])) return null;
  }
  const tr = ps.trend;
  if (tr != null) {
    if (!Array.isArray(tr)) return null;
    for (const v of tr) if (!isNum(v)) return null;
  }
  au = au.slice().sort((x, y) => (y.added + y.deleted) - (x.added + x.deleted) || y.commits - x.commits);
  t = t || {};
  const sum = (n) => au.reduce((s, x) => s + x[n], 0);
  return { au, trend: tr || [], commits: t.commits != null ? t.commits : sum('commits'), added: t.added != null ? t.added : sum('added'), deleted: t.deleted != null ? t.deleted : sum('deleted') };
}
/* -> {p} for a read period, or {off, msg, detail}; off = the whole acquisition is unavailable (toggle disabled) */
function resolve(data, cur) {
  if (data.status === 'error' || (typeof data.error === 'string' && data.error))
    return { off: true, msg: typeof data.error === 'string' && data.error ? data.error : 'Data could not be read', detail: typeof data.detail === 'string' ? data.detail : '' };
  if (!isObj(data.periods)) return { off: true, msg: 'Contribution data is missing or malformed.' };
  const p = readPeriod(data.periods[cur]);
  if (!p) return { off: false, msg: NAMES[cur] + ' data is missing or malformed.' };
  return { p };
}

function storedPeriod() { try { const v = localStorage.getItem(STORE); return KEYS.indexOf(v) >= 0 ? v : null; } catch (e) { return null; } }

// Every data arrival redraws and sets the chip again, identical value or not (the original redrew on each ccb.onData).
// useData() is not used: it skips an identical value, and ccb.onData must not be called next to it.
let latest = { n: 0, data: ccb.data };
const listeners = new Set();
if (typeof ccb.onData === 'function') ccb.onData((data) => { latest = { n: latest.n + 1, data }; listeners.forEach((f) => f()); });
function useDataEvents() {
  const [ev, setEv] = useState(latest);
  useEffect(() => {
    const f = () => setEv(latest);
    listeners.add(f);
    if (latest !== ev) f();
    return () => { listeners.delete(f); };
  }, []);
  return ev;
}

function Contributions() {
  const ev = useDataEvents();
  const data = useMemo(() => norm(ev.data || {}), [ev]);
  // The selection survives data events and resizes; data.period only picks the first one (a stored choice wins).
  const [cur, setCur] = useState(() => storedPeriod() || (KEYS.indexOf(data.period) >= 0 ? data.period : 'week'));
  const dataRef = useRef(data);
  dataRef.current = data;
  const listRef = useRef(null);
  const r = resolve(data, cur), p = r.p;

  useEffect(() => {
    try { ccb.setStatus(p ? { text: p.commits + (p.commits === 1 ? ' commit' : ' commits'), tone: p.commits ? 'good' : 'neutral' } : { text: 'Unavailable', tone: 'warning' }); } catch (e) { /* the chip is optional */ }
  }, [ev, cur]);
  useLayoutEffect(() => { if (listRef.current) listRef.current.scrollTop = 0; }, [cur]);

  const pick = (k) => {
    setCur(k);
    try { localStorage.setItem(STORE, k); } catch (e) { /* no storage in the frame */ }
    try { const s = ccb.save(Object.assign({}, dataRef.current, { period: k })); if (s && s.catch) s.catch(() => {}); } catch (e) { /* not saved where nothing is kept */ }
  };

  const top = html`<div class="top">
    <div class="ttl">Contributions<small>${typeof data.repo === 'string' ? data.repo : ''}</small></div>
    <div class=${'seg' + (r.off ? ' off' : '')} role="tablist" style=${{ '--i': KEYS.indexOf(cur) }}>
      ${KEYS.map((k) => html`<button type="button" key=${k} class=${k === cur ? 'on' : ''} aria-pressed=${k === cur ? 'true' : 'false'} disabled=${!!r.off} onClick=${() => pick(k)}>${NAMES[k]}</button>`)}
    </div>
  </div>`;

  if (!p) {
    const detail = r.detail ? r.detail.slice(0, 240) : '';
    return html`<${Card} class="cb-card"><div class="cb">${top}
      <div class="un" role="alert"><div class="uic" aria-hidden="true">!</div><div class="utx">
        <div class="uh">Unavailable</div><div class="us">${r.msg}</div>
        ${detail && html`<div class="ud" title=${detail}>${detail}</div>`}
      </div></div>
    </div><//>`;
  }

  const max = Math.max(...p.au.map((a) => a.added + a.deleted), 1);
  const tmax = Math.max(...p.trend, 1);
  const seen = new Map();
  return html`<${Card} class="cb-card"><div class="cb">${top}
    <div class="sum">
      <div class="big">${p.commits}<small>${(p.commits === 1 ? 'commit' : 'commits') + ' · ' + SUB[cur]}</small></div>
      <div class="lines">
        <span><b class="a">+${fmt(p.added)}</b> <span class="lbl">added</span></span>
        <span><b class="d">−${fmt(p.deleted)}</b> <span class="lbl">deleted</span></span>
      </div>
      ${p.trend.length > 0 && html`<div class="trend" title=${'Commits per ' + (cur === 'day' ? 'hour' : 'day')}>
        ${p.trend.map((v, i) => html`<i key=${i} class=${v ? '' : 'z'} style=${{ height: Math.max(6, Math.round(v / tmax * 100)) + '%' }}></i>`)}
      </div>`}
    </div>
    ${!p.au.length
      ? html`<div class="empty">No commits in this period</div>`
      : html`<div class="list" ref=${listRef}>${p.au.map((a, i) => {
          const l = a.added + a.deleted, w = l / max * 100, aw = l ? a.added / l * w : 0, dw = w - aw;
          const n = seen.get(a.name) || 0;
          seen.set(a.name, n + 1);
          return html`<div class="row" key=${n + ':' + a.name}>
            <span class="rk">${i + 1}</span><span class="nm" title=${a.name}>${a.name}</span>
            <span class="st"><span class="cm">${a.commits + ' · '}</span><span class="a">+${fmt(a.added)}</span> <span class="d">−${fmt(a.deleted)}</span></span>
            <div class="bar"><i class="ba" style=${{ width: aw + '%' }}></i><i class="bd" style=${{ width: dw + '%' }}></i></div>
          </div>`;
        })}</div>`}
  </div><//>`;
}

render(html`<${Contributions} />`, document.getElementById('app'));
</script>
