<meta name="ccb-kit" content="1">
<style>
  html, body { margin:0; background:transparent; }
  html[data-surface="board"], html[data-surface="board"] body, html[data-surface="board"] #app { height:100%; }
  .du-card { --ccb-pad:12px; }
  html[data-surface="board"] .du-card { height:100%; }
  .du, .du * { box-sizing:border-box; }
  .du { display:flex; flex-direction:column; flex:1; min-width:0; min-height:0; color:var(--text); font:14px/1.4 -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif; overflow-wrap:anywhere; }
  .full { display:flex; flex-direction:column; flex:1; min-width:0; min-height:0; }
  .head { display:flex; align-items:baseline; flex-wrap:wrap; gap:2px 10px; flex:none; padding-right:36px; }
  .title { font-size:16px; font-weight:600; }
  .big { margin-left:auto; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
  .meter { flex:none; margin-top:8px; height:10px; border-radius:5px; background:color-mix(in srgb, var(--text) 10%, transparent); overflow:hidden; }
  .meter > i { display:block; height:100%; border-radius:5px; background:var(--blue); }
  .meter.warn > i { background:var(--orange); }
  .meter.bad > i { background:var(--error); }
  .msub { flex:none; margin-top:4px; display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }

  /* Everything under the capacity header: scrolls inside a Board tile / sized pin, grows in the chat. */
  .body { flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  .main { display:flex; flex-direction:column; align-items:stretch; gap:12px; margin-top:12px; }
  .donutbox { flex:none; align-self:center; position:relative; width:min(168px,100%); aspect-ratio:1/1; }
  .donutbox svg { width:100%; height:100%; display:block; transform:rotate(-90deg); }
  .center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; pointer-events:none; }
  .center b { font-size:26px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums; }
  .center span { font-size:11px; color:var(--muted); }
  .list { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:7px; }
  .row { min-width:0; }
  .rtop { display:flex; align-items:center; gap:8px; min-width:0; font-size:13px; line-height:1.3; }
  .sw { flex:none; width:10px; height:10px; border-radius:3px; }
  .sw.hatch { background:repeating-linear-gradient(45deg,#8A8A94 0 2px,transparent 2px 4px); outline:1px solid #8A8A94; outline-offset:-1px; }
  .rname { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rgrp { flex:none; font-size:11px; color:var(--muted); white-space:nowrap; }
  .rval { flex:none; font-size:12px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .rval b { color:var(--text); font-weight:600; }
  .rbar { margin-top:3px; height:5px; border-radius:3px; background:color-mix(in srgb, var(--text) 10%, transparent); overflow:hidden; }
  .rbar > i { display:block; height:100%; border-radius:3px; }
  .rbar > i.hatch { background:repeating-linear-gradient(45deg,#8A8A94 0 3px,transparent 3px 6px); }
  .note { margin-top:2px; font-size:11px; color:var(--muted); }

  .extra { margin-top:12px; display:flex; flex-direction:column; gap:6px; }
  details { font-size:12px; color:var(--muted); }
  summary { cursor:pointer; min-height:24px; display:flex; align-items:center; }
  details div { margin:2px 0 2px 12px; font-family:ui-monospace,Menlo,monospace; font-size:11px; word-break:break-all; }
  .errs { font-size:11px; line-height:1.4; color:var(--orange-text); }
  .foot { margin-top:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .upd { font-size:12px; color:var(--muted); }
  .rf { --ccb-control-h:44px; min-height:44px; padding:0 16px; font-size:13px; }
  .hint { font-size:12px; color:var(--muted); }
  .hint.err { color:var(--orange-text); }
  .spin { display:inline-block; width:12px; height:12px; margin-right:8px; vertical-align:-2px; border:2px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:dspin .8s linear infinite; }
  @keyframes dspin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration:2.4s; } }

  .tiny { display:none; }
  .short-note { display:none; }
  .empty { margin-top:10px; color:var(--muted); }

  /* wide: donut left, list right */
  @container ccb (min-width:560px) {
    .main { flex-direction:row; align-items:center; gap:20px; }
    .donutbox { align-self:center; width:190px; }
  }
  /* short: summary only, small donut; what is left out is said in one line */
  @container ccb (max-height:300px) {
    .list, .extra, .foot { display:none; }
    .main { margin-top:8px; }
    .donutbox { width:84px; }
    .center b { font-size:15px; }
    .center span { display:none; }
    .short-note { display:block; margin-top:8px; font-size:11px; color:var(--muted); }
  }
  /* tiny */
  @container ccb (max-height:150px) {
    .full { display:none; }
    .tiny { display:flex; flex-direction:column; justify-content:center; height:100%; gap:2px; }
    .tiny b { font-size:30px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums; }
    .tiny b small { font-size:14px; font-weight:500; color:var(--muted); }
    .tiny span { font-size:12px; color:var(--muted); }
  }
  @container ccb (max-width:170px) {
    .full { display:none; }
    .tiny { display:flex; flex-direction:column; justify-content:center; height:100%; gap:2px; }
    .tiny b { font-size:26px; font-weight:600; line-height:1.1; }
    .tiny b small { font-size:13px; font-weight:500; color:var(--muted); }
    .tiny span { font-size:12px; color:var(--muted); }
  }
  html[data-size="1x1"] .full { display:none; }
  html[data-size="1x1"] .tiny { display:flex; flex-direction:column; justify-content:center; height:100%; gap:2px; }
  html[data-size="1x1"] .tiny b { font-size:26px; font-weight:600; line-height:1.1; }
  html[data-size="1x1"] .tiny b small { font-size:13px; font-weight:500; color:var(--muted); }
  html[data-size="1x1"] .tiny span { font-size:12px; color:var(--muted); }
</style>
<div id="app"></div>
<script>
const { html, render, useState, useEffect, useMemo, useRef, Card, Button } = ccb.kit;

const COLORS = ['#4C8DFF', '#F7C27F', '#57C785', '#B392F0', '#FF8A80', '#4DD0E1', '#E6A0D8', '#C7D36F'];
const NS = 'http://www.w3.org/2000/svg';

const num = (v) => { const n = typeof v === 'number' ? v : parseFloat(v); return Number.isFinite(n) ? n : null; };
const fmt = (n) => n === null ? '–' : (Math.abs(n) >= 100 ? String(Math.round(n)) : String(Math.round(n * 10) / 10));
const normalize = (raw) => {
  if (typeof raw === 'string') { try { raw = JSON.parse(raw); } catch (e) { raw = null; } }
  if (raw && typeof raw === 'object' && typeof raw.output === 'string') { try { raw = JSON.parse(raw.output); } catch (e) { /* keep the wrapper */ } }
  return (raw && typeof raw === 'object') ? raw : {};
};

/* Same arithmetic as before the kit: the donut and the bars are shares of `denom` = max(used, sum of the listed
   categories), which is NOT the volume's total; categories may overlap, and "unclassified" is only what the data says. */
const compute = (raw) => {
  const d = normalize(raw);
  const unit = d.unit || 'GB';
  const items = (Array.isArray(d.items) ? d.items : []).filter((x) => x && num(x.gb) !== null && num(x.gb) > 0)
    .map((x) => ({ name: String(x.name || '?'), gb: num(x.gb), group: x.group ? String(x.group) : '' }))
    .sort((a, b) => b.gb - a.gb);
  const un = d.unclassified && num(d.unclassified.gb) > 0 ? { gb: num(d.unclassified.gb), note: d.unclassified.note ? String(d.unclassified.note) : '' } : null;
  const total = num(d.total);
  let used = num(d.used), free = num(d.free);
  if (used === null && total !== null && free !== null) used = total - free;
  if (free === null && total !== null && used !== null) free = total - used;
  const sum = items.reduce((s, x) => s + x.gb, 0) + (un ? un.gb : 0);
  if (used === null && sum > 0) used = sum;
  const pct = (total && used !== null) ? used / total * 100 : null;
  const tone = pct === null ? 'neutral' : (pct > 85 ? 'warning' : 'good');
  const slices = items.slice(0, 8).map((x, i) => Object.assign({ color: COLORS[i] }, x));
  const rest = items.slice(8);
  if (rest.length) slices.push({ name: 'Other (' + rest.length + ' items)', gb: rest.reduce((s, x) => s + x.gb, 0), group: '', color: '#7C8798' });
  if (un) slices.push({ name: 'Unclassified / system & snapshots', gb: un.gb, group: '', hatch: true, note: un.note });
  const denom = Math.max(used || 0, sum) || 1;
  return {
    d, unit, total, used, free, pct, tone, slices, denom,
    snaps: Array.isArray(d.snapshots) ? d.snapshots.map(String) : [],
    errs: Array.isArray(d.errors) ? d.errors.map(String) : [],
  };
};

/* Every data arrival (also the result of a refresh) redraws and sets the chip again, identical value or not,
   like the ccb.onData handler it replaces. useData() skips an identical value, so it is not used here. */
const initialRaw = () => {
  const dk = window.deck;
  return (dk && dk.data !== undefined) ? dk.data : (ccb.data !== undefined ? ccb.data : null);
};
let latest = { n: 0, data: initialRaw() };
const listeners = new Set();
const push = (data) => { latest = { n: latest.n + 1, data }; listeners.forEach((f) => f()); };
if (typeof ccb.onData === 'function') ccb.onData((nd) => push(nd !== undefined ? nd : ccb.data));
function useDataEvents() {
  const [ev, setEv] = useState(latest);
  useEffect(() => {
    const f = () => setEv(latest);
    listeners.add(f);
    if (latest !== ev) f();
    return () => { listeners.delete(f); };
  }, []);
  return ev;
}

function Donut({ m }) {
  const { slices, denom, pct, unit } = m;
  let off = 0;
  return html`<div class="donutbox">
    <svg viewBox="0 0 100 100" role="img" aria-label=${'Disk usage by category, ' + (pct === null ? '' : Math.round(pct) + '% of the volume used')}>
      <defs><pattern id="dh" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="4" height="4" fill="rgba(138,138,148,.25)" /><rect width="2" height="4" fill="#8A8A94" />
      </pattern></defs>
      <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(160,160,170,.18)" stroke-width="14" />
      ${slices.map((s, i) => {
        const len = s.gb / denom * 100;
        const dash = Math.max(len - 0.4, 0.1);
        const o = off; off += len;
        return html`<circle key=${i} cx="50" cy="50" r="38" fill="none" stroke=${s.hatch ? 'url(#dh)' : s.color} stroke-width="14" pathLength="100"
          stroke-dasharray=${dash + ' ' + (100 - dash)} stroke-dashoffset=${-o}><title>${s.name + '  ' + fmt(s.gb) + ' ' + unit}</title></circle>`;
      })}
    </svg>
    <div class="center"><b>${pct === null ? '–' : Math.round(pct) + '%'}</b><span>used</span></div>
  </div>`;
}

function Rows({ m }) {
  const { slices, denom, unit } = m;
  return html`<div class="list">${slices.map((s, i) => html`<div class="row" key=${i}>
    <div class="rtop">
      <span class=${'sw' + (s.hatch ? ' hatch' : '')} style=${s.hatch ? undefined : { background: s.color }}></span>
      <span class="rname" title=${s.name + (s.group ? ' (' + s.group + ')' : '')}>${s.name}</span>
      ${s.group && html`<span class="rgrp">${s.group}</span>`}
      <span class="rval"><b>${fmt(s.gb) + ' ' + unit}</b>${' · ' + (s.gb / denom * 100).toFixed(1) + '%'}</span>
    </div>
    <div class="rbar"><i class=${s.hatch ? 'hatch' : ''} style=${s.hatch ? { width: Math.min(100, s.gb / denom * 100) + '%' } : { width: Math.min(100, s.gb / denom * 100) + '%', background: s.color }}></i></div>
    ${s.note && html`<div class="note">${s.note}</div>`}
  </div>`)}</div>`;
}

function Busy() {
  return html`<span class="spin"></span>Scanning... about 1 min`;
}

function Disk() {
  const ev = useDataEvents();
  const m = useMemo(() => compute(ev.data), [ev]);
  const { d, unit, total, used, free, pct, tone, slices, snaps, errs } = m;
  const [scanning, setScanning] = useState(false);
  const [scanError, setScanError] = useState('');
  const [noRefresh, setNoRefresh] = useState(-1);
  const [fails, setFails] = useState(0);
  const busy = useRef(false);

  useEffect(() => {
    try { ccb.setStatus(used === null ? null : { text: fmt(used) + '/' + fmt(total) + ' ' + unit, tone }); } catch (e) { /* the chip is optional */ }
  }, [ev]);

  const refresh = async () => {
    if (busy.current) return;
    if (typeof ccb.runDetail !== 'function') { setNoRefresh(ev.n); return; }
    busy.current = true; setScanning(true); setScanError('');
    try {
      const res = await ccb.runDetail({ scan: 'now' }, { save: true });
      const nd = normalize(res);
      if (!nd || (nd.total === undefined && nd.used === undefined && !Array.isArray(nd.items))) throw new Error('No valid data received');
      busy.current = false; setScanning(false); setScanError('');
      push(nd);
    } catch (e) {
      busy.current = false; setScanning(false); setScanError(String((e && e.message) || e || 'Unknown error')); setFails((f) => f + 1);
    }
  };

  if (used === null && !slices.length) return html`<${Card} class="du-card"><div class="du"><div class="empty">No disk data yet</div></div><//>`;

  const hiddenBits = [];
  if (slices.length) hiddenBits.push(slices.length + (slices.length === 1 ? ' category' : ' categories'));
  if (errs.length) hiddenBits.push(errs.length + (errs.length === 1 ? ' warning' : ' warnings'));

  return html`<${Card} class="du-card"><div class="du">
    <div class="tiny"><b>${fmt(used) + '/' + fmt(total) + ' '}<small>${unit}</small></b><span>Disk used</span></div>
    <div class="full">
      <div class="head">
        <span class="title">Disk Usage Breakdown</span>
        <span class="big">${'Used ' + fmt(used) + (total ? ' / ' + fmt(total) : '') + ' ' + unit}</span>
      </div>
      ${pct !== null && html`<div class=${'meter' + (pct > 95 ? ' bad' : pct > 85 ? ' warn' : '')} role="meter" aria-label="Volume used" aria-valuemin="0" aria-valuemax="100" aria-valuenow=${Math.min(100, Math.max(0, pct))}><i style=${{ width: Math.min(100, pct) + '%' }}></i></div>`}
      ${pct !== null && html`<div class="msub"><span>${pct.toFixed(1) + '% used'}</span><span>${'Free ' + fmt(free) + ' ' + unit}</span></div>`}
      ${hiddenBits.length > 0 && html`<div class="short-note">${hiddenBits.join(' · ') + ' not shown at this size, enlarge the card to see them'}</div>`}
      <div class="body">
        ${slices.length > 0 && html`<div class="main"><${Donut} m=${m} /><${Rows} m=${m} /></div>`}
        ${(snaps.length > 0 || errs.length > 0) && html`<div class="extra">
          ${snaps.length > 0 && html`<details key=${ev.n + ':' + fails}><summary>${'Local snapshots: ' + snaps.length}</summary>${snaps.map((s, i) => html`<div key=${i}>${s}</div>`)}</details>`}
          ${errs.map((e, i) => html`<div class="errs" key=${i}>${'⚠ ' + e}</div>`)}
        </div>`}
        <div class="foot">
          <${Button} class="rf" disabled=${scanning} aria-busy=${scanning ? 'true' : 'false'} onClick=${refresh}>${scanning ? html`<${Busy} />` : 'Refresh'}<//>
          ${scanError ? html`<span class="hint err" role="alert">${'Refresh failed: ' + scanError}</span>` : (noRefresh === ev.n && html`<span class="hint">Use the ↻ button at the top right (hover over the card) to refresh</span>`)}
          ${d.updated && html`<span class="upd">${'Updated ' + d.updated}</span>`}
        </div>
      </div>
    </div>
  </div><//>`;
}

render(html`<${Disk} />`, document.getElementById('app'));
</script>
