<meta name="ccb-kit" content="1">
<style>
  html[data-surface="board"], html[data-surface="board"] body, html[data-surface="board"] #app { height:100%; margin:0; }
  .rp-card { --ccb-pad:12px; }
  html[data-surface="board"] .rp-card { height:100%; }
  .rp { display:flex; flex-direction:column; gap:10px; flex:1; min-width:0; min-height:0; font-size:14px; line-height:1.4; color:var(--text); }

  .head { display:flex; flex-direction:column; gap:8px; flex:none; }
  .title-row { display:flex; align-items:baseline; gap:8px; min-width:0; }
  .ver { font-size:20px; font-weight:700; letter-spacing:-.01em; white-space:nowrap; }
  .count { font-size:14px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .count b { color:var(--text); font-weight:700; }
  .updated { margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap; padding-right:36px; }
  .bar { height:8px; border-radius:99px; background:color-mix(in srgb, var(--text) 10%, transparent); overflow:hidden; display:flex; }
  .bar i { display:block; height:100%; background:var(--green); transition:width .5s ease; }

  .brief { display:none; font-size:13px; color:var(--muted); min-width:0; }
  .brief .w { display:flex; align-items:center; gap:7px; color:var(--text); min-width:0; margin-top:3px; }
  .brief .w span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .brief .none { color:var(--muted); }
  .mini { display:none; font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-variant-numeric:tabular-nums; align-items:center; gap:6px; }
  .mini.bad { color:var(--error); } .mini.good { color:var(--green); }

  .list { display:flex; flex-direction:column; gap:4px; min-height:0; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  .item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; flex:none;
    background:color-mix(in srgb, var(--text) 5%, transparent); min-height:36px; transition:background .15s; }
  .item:hover { background:color-mix(in srgb, var(--text) 8%, transparent); }
  .item.working { background:color-mix(in srgb, var(--blue) 14%, transparent); }
  .item.failed { background:color-mix(in srgb, var(--error) 14%, transparent); }
  .item.merged .t { color:var(--muted); }
  .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tag { font-size:11px; color:var(--muted); flex:none; }
  .empty { color:var(--muted); text-align:center; padding:16px 0; }

  .ic { flex:none; width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; border-radius:50%; }
  .ic.merged { background:var(--green); color:#fff; }
  .ic.failed { background:var(--error); color:#fff; }
  .ic.queued { border:2px solid var(--faint); }
  .ic.working { border:2.5px solid color-mix(in srgb, var(--blue) 28%, transparent); border-top-color:var(--blue); animation:spin .9s linear infinite; }
  .brief .ic { width:14px; height:14px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ic.working { animation-duration:3s; } }

  /* small: version, bar, count, working names */
  @container ccb (max-height: 230px) {
    .list, .updated { display:none; }
    .brief { display:block; }
  }
  @container ccb (max-width: 300px) {
    .list, .updated { display:none; }
    .brief { display:block; }
  }
  /* tiny: just "version · merged/total" */
  @container ccb (max-height: 100px) {
    .rp { justify-content:center; }
    .head, .list, .brief { display:none; }
    .mini { display:flex; }
  }
  @container ccb (max-width: 170px) {
    .head, .list, .brief { display:none; }
    .mini { display:flex; }
    .rp { justify-content:center; }
  }
</style>
<div id="app"></div>
<script>
const { html, render, useState, useEffect, useMemo, Card } = ccb.kit;

const ORDER = { working: 0, failed: 1, queued: 2, merged: 3 };
const LABEL = { working: 'In progress', failed: 'Failed', queued: 'Queued', merged: 'Merged' };

function parse(raw) {
  let d = raw;
  if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) { d = null; } }
  if (d && typeof d === 'object' && typeof d.output === 'string' && !d.items) {
    try { d = JSON.parse(d.output); } catch (e) {}
  }
  if (!d || typeof d !== 'object') d = {};
  let items = Array.isArray(d.items) ? d.items : [];
  items = items.map((it, i) => {
    if (typeof it === 'string') it = { title: it };
    it = it || {};
    let s = String(it.status || 'queued').toLowerCase();
    if (!(s in ORDER)) s = 'queued';
    return { title: String(it.title == null ? '(untitled)' : it.title), status: s, i: i };
  }).sort((a, b) => ORDER[a.status] - ORDER[b.status] || a.i - b.i);
  return { version: d.version == null ? '' : String(d.version), updated: d.updated == null ? '' : String(d.updated), items: items };
}

// Every data arrival redraws and re-sets the chip, identical value or not (the original redrew on each ccb.onData);
// the 1 s check of ccb.data is the original's fallback for a change that raises no event. useData() is not used:
// it skips an identical value, and ccb.onData must not be called next to it.
const snap = () => { try { return JSON.stringify(ccb.data); } catch (e) { return String(Math.random()); } };
function useDataEvents() {
  const [n, setN] = useState(1);
  useEffect(() => {
    let last = snap();
    const bump = () => { last = snap(); setN((x) => x + 1); };
    const stop = typeof ccb.onData === 'function' ? ccb.onData(bump) : null;
    const timer = setInterval(() => { if (snap() !== last) bump(); }, 1000);
    return () => { if (typeof stop === 'function') stop(); clearInterval(timer); };
  }, []);
  return n;
}

const Icon = ({ status }) => html`<span class=${'ic ' + status}>${status === 'merged' ? '✓' : status === 'failed' ? '✕' : ''}</span>`;

function ReleaseProgress() {
  const n = useDataEvents();
  const m = useMemo(() => parse(ccb.data), [n]);
  const items = m.items, total = items.length;
  const cnt = { working: 0, failed: 0, queued: 0, merged: 0 };
  items.forEach((it) => { cnt[it.status]++; });
  const merged = cnt.merged;
  const frac = merged + '/' + total;
  const allDone = total > 0 && merged === total;
  const tone = cnt.failed > 0 ? 'bad' : (allDone ? 'good' : 'neutral');

  const t = m.updated.match(/(\d{1,2}):(\d{2})/);
  const updated = t ? 'Updated ' + (t[1].length < 2 ? '0' : '') + t[1] + ':' + t[2] : '';
  const working = items.filter((i) => i.status === 'working');
  const brief = working.length
    ? [...working.slice(0, 2).map((w, k) => html`<div class="w" key=${k}><${Icon} status="working" /><span>${w.title}</span></div>`),
       working.length > 2 && html`<div class="none">${'+' + (working.length - 2) + ' more in progress'}</div>`]
    : html`<div class="none">${cnt.failed ? cnt.failed + ' failed' : allDone ? 'All merged' : total ? 'Nothing in progress' : 'No items yet'}</div>`;

  useEffect(() => {
    if (typeof ccb.setStatus !== 'function') return;
    try { ccb.setStatus({ text: frac, tone: tone }); } catch (e) { /* the chip is optional */ }
  }, [n]);

  return html`<${Card} class="rp-card"><div class="rp">
    <div class="head">
      <div class="title-row">
        <span class="ver">${m.version || 'Release progress'}</span>
        <span class="count"><b>${merged}</b>${'/' + total}</span>
        <span class="updated">${updated}</span>
      </div>
      <div class="bar"><i style=${{ width: (total ? Math.round(merged / total * 100) : 0) + '%' }}></i></div>
      <div class="brief">${brief}</div>
    </div>
    <div class="list">
      ${!total && html`<div class="empty">No items yet</div>`}
      ${items.map((it) => html`<div class=${'item ' + it.status} key=${it.i}>
        <${Icon} status=${it.status} />
        <span class="t" title=${it.title}>${it.title}</span>
        <span class="tag">${LABEL[it.status]}</span>
      </div>`)}
    </div>
    <div class=${'mini' + (cnt.failed ? ' bad' : allDone ? ' good' : '')}>${(m.version ? m.version + ' · ' : '') + frac}</div>
  </div><//>`;
}

render(html`<${ReleaseProgress} />`, document.getElementById('app'));
</script>
