  // 自動計算 2D 泳道座標與正交連線路由 (Bot 只需要給 JSON，不需要手算 x, y 座標！)
  function computeLayout(spec) {
    const W = 1100;
    const LANE_X = 20;
    const LANE_W = W - 40;
    const LANE_H = 138;
    const LANE_GAP = 42;
    const NODE_H = 84;
    const PAD_X = 28;

    const placedNodes = new Map();
    const lanes = spec.layers.map((layer, idx) => {
      const y = 30 + idx * (LANE_H + LANE_GAP);
      const layerNodes = spec.nodes.filter(n => n.layer === layer.id);
      const totalSpan = layerNodes.reduce((acc, n) => acc + (n.span || 1), 0) || 1;
      const gap = 24;
      const availW = LANE_W - PAD_X * 2 - gap * Math.max(0, layerNodes.length - 1);

      let curX = LANE_X + PAD_X;
      layerNodes.forEach(n => {
        const span = n.span || 1;
        const nw = Math.round((availW * span) / totalSpan);
        const ny = y + 34;
        placedNodes.set(n.id, {
          ...n,
          x: curX,
          y: ny,
          w: nw,
          h: NODE_H,
          cx: Math.round(curX + nw / 2),
          cy: Math.round(ny + NODE_H / 2)
        });
        curX += nw + gap;
      });

      return { ...layer, x: LANE_X, y, w: LANE_W, h: LANE_H };
    });

    const totalH = 30 + lanes.length * (LANE_H + LANE_GAP) - LANE_GAP + 24;

    const placedEdges = (spec.edges || []).map(e => {
      const a = placedNodes.get(e.from);
      const b = placedNodes.get(e.to);
      if (!a || !b) return null;

      let d = "";
      let lx = 0, ly = 0;
      const sameRow = Math.abs(a.y - b.y) < 20;

      if (sameRow) {
        const leftToRight = a.x < b.x;
        const x1 = leftToRight ? a.x + a.w : a.x;
        const x2 = leftToRight ? b.x : b.x + b.w;
        const y = a.cy + (e.offset || 0);
        d = `M ${x1} ${y} L ${x2} ${y}`;
        lx = Math.round((x1 + x2) / 2);
        ly = y - 16;
      } else {
        const down = a.y < b.y;
        const shift = e.offset || 0;
        const x1 = a.cx + shift;
        const y1 = down ? a.y + a.h : a.y;
        const x2 = b.cx + shift;
        const y2 = down ? b.y : b.y + b.h;
        const midY = Math.round((y1 + y2) / 2);

        if (Math.abs(x1 - x2) < 12) {
          d = `M ${x1} ${y1} L ${x1} ${y2}`;
          lx = x1;
          ly = midY;
        } else {
          d = `M ${x1} ${y1} L ${x1} ${midY} L ${x2} ${midY} L ${x2} ${y2}`;
          lx = Math.round((x1 + x2) / 2);
          ly = midY;
        }
      }

      const lw = Math.max(76, (e.label ? e.label.length * 10 + 22 : 80));
      return { ...e, d, lx, ly, lw };
    }).filter(Boolean);

    return { w: W, h: totalH, lanes, nodes: [...placedNodes.values()], edges: placedEdges };
  }

  function esc(s) {
    return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function renderTopology(root, rawData) {
    const spec = parseSpec(rawData);
    const layout = computeLayout(spec);
    let selectedId = (spec.nodes.find(n => n.hub) || spec.nodes[0] || {}).id;
    let focused = false;

    function update() {
      const activeNode = spec.nodes.find(n => n.id === selectedId) || spec.nodes[0] || {};
      const connectedNodes = new Set([selectedId]);
      const connectedEdges = new Set();

      layout.edges.forEach((e, idx) => {
        if (e.from === selectedId || e.to === selectedId) {
          connectedEdges.add(idx);
          connectedNodes.add(e.from);
          connectedNodes.add(e.to);
        }
      });

      const lanesSvg = layout.lanes.map(l => {
        const bw = Math.min(460, Math.max(240, l.title.length * 9.5 + 28));
        return `
          <rect x="${l.x}" y="${l.y}" width="${l.w}" height="${l.h}" rx="14" class="lane-box" />
          <rect x="${l.x + 16}" y="${l.y - 11}" width="${bw}" height="22" rx="6" class="lane-badge" />
          <text x="${l.x + 28}" y="${l.y + 4}" class="lane-title">${esc(l.title)}</text>
        `;
      }).join("");

      const edgesSvg = layout.edges.map((e, idx) => {
        const isHi = focused && connectedEdges.has(idx);
        const kindCls = e.kind === "async" ? "wire-async" : (e.kind === "core" ? "wire-core" : "wire-primary");
        const marker = e.kind === "async" ? "url(#topo-arrow-slate)" : (e.kind === "core" ? "url(#topo-arrow-blue)" : "url(#topo-arrow-sky)");
        return `
          <g class="wire-group ${isHi ? "highlight" : ""}">
            <path d="${e.d}" class="wire ${kindCls}" marker-end="${marker}" />
            ${e.kind !== "async" ? `<path d="${e.d}" class="wire-flow" />` : ""}
            ${e.label ? `
              <rect x="${e.lx - e.lw / 2}" y="${e.ly - 10}" width="${e.lw}" height="20" class="wire-label-bg" />
              <text x="${e.lx}" y="${e.ly}" class="wire-label-text">${esc(e.label)}</text>
            ` : ""}
          </g>
        `;
      }).join("");

      const nodesSvg = layout.nodes.map(n => {
        const isHi = focused && connectedNodes.has(n.id);
        const isAct = focused && n.id === selectedId;
        const tagW = n.tag ? Math.max(68, n.tag.length * 7.2 + 16) : 0;
        return `
          <g class="arch-node ${n.hub ? "node-hub" : ""} ${isAct ? "active" : ""} ${isHi ? "highlight" : ""}" data-node-id="${esc(n.id)}" transform="translate(${n.x}, ${n.y})">
            <rect width="${n.w}" height="${n.h}" rx="12" class="node-rect" />
            <text x="16" y="26" class="node-title">${esc(n.title)}</text>
            ${n.tag ? `
              <rect x="${n.w - tagW - 12}" y="11" width="${tagW}" height="19" rx="5" class="${n.hub ? "node-tag-bg-blue" : "node-tag-bg"}" />
              <text x="${n.w - tagW / 2 - 12}" y="20.5" class="${n.hub ? "node-tag-text-blue" : "node-tag-text"}">${esc(n.tag)}</text>
            ` : ""}
            ${n.subtitle ? `<text x="16" y="48" class="node-subtitle">${esc(n.subtitle)}</text>` : ""}
            ${n.meta ? `<text x="16" y="68" class="node-meta">${esc(n.meta)}</text>` : ""}
          </g>
        `;
      }).join("");

      const subcardsHtml = (activeNode.subcomponents || []).map(sc => `
        <div class="ins-card">
          <div>
            <div class="ins-card-title">${esc(sc.name)}</div>
            <div class="ins-card-body">${esc(sc.body)}</div>
          </div>
          ${sc.code ? `<div class="ins-card-code">📂 ${esc(sc.code)}</div>` : ""}
        </div>
      `).join("");

      root.innerHTML = `
        <div class="topo-root">
          <div class="topo-header">
            <div>
              <h2 class="topo-title">${esc(spec.title || "系統架構拓撲圖")}</h2>
              <p class="topo-sub">${esc(spec.subtitle || "點擊任一節點高亮關聯線路並展開內部細節")}</p>
            </div>
            <button type="button" class="topo-reset" id="topo-reset-btn">顯示全部連線</button>
          </div>

          <div class="topo-canvas">
            <svg class="topo-svg ${focused ? "canvas-focused" : ""}" viewBox="0 0 ${layout.w} ${layout.h}" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <marker id="topo-arrow-sky" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--wire-sky)" />
                </marker>
                <marker id="topo-arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--wire-blue)" />
                </marker>
                <marker id="topo-arrow-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                  <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="var(--wire-slate)" />
                </marker>
                <linearGradient id="topo-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" style="stop-color:var(--grad-a1)" />
                  <stop offset="100%" style="stop-color:var(--grad-a2)" />
                </linearGradient>
                <linearGradient id="topo-hub-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:var(--hub-a1)" />
                  <stop offset="100%" style="stop-color:var(--hub-a2)" />
                </linearGradient>
              </defs>
              ${lanesSvg}
              ${edgesSvg}
              ${nodesSvg}
            </svg>
          </div>

          <div class="topo-inspector">
            <div class="ins-head">
              <span class="ins-badge">${esc(activeNode.tag || "COMPONENT")}</span>
              <h3 class="ins-title">${esc(activeNode.title || "")}</h3>
            </div>
            <p class="ins-desc">${esc(activeNode.desc || activeNode.subtitle || "")}</p>
            ${subcardsHtml ? `<div class="ins-grid">${subcardsHtml}</div>` : ""}
          </div>
        </div>
      `;

      root.querySelectorAll(".arch-node").forEach(el => {
        el.addEventListener("click", () => {
          selectedId = el.getAttribute("data-node-id");
          focused = true;
          update();
        });
      });

      const resetBtn = root.querySelector("#topo-reset-btn");
      if (resetBtn) {
        resetBtn.addEventListener("click", () => {
          focused = false;
          update();
        });
      }
    }

    update();
  }

  const mount = document.getElementById("app");
  if (window.ccb && typeof window.ccb.onData === "function") {
    renderTopology(mount, window.ccb.data);
    window.ccb.onData(data => renderTopology(mount, data));
  } else {
    renderTopology(mount, window.ARCH_SPEC || DEFAULT_SPEC);
  }
})();
</script>
