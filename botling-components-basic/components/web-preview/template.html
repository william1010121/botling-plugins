<meta name="ccb-kit" content="1">
<style>
  html, body { margin:0; background:transparent; }
  html[data-surface="board"], html[data-surface="board"] body, html[data-surface="board"] #app { height:100%; }
  .wp-card { --ccb-pad:12px; }
  html[data-surface="board"] .wp-card { height:100%; }
  .wp, .wp * { box-sizing:border-box; }
  .wp { display:flex; flex-direction:column; flex:1; gap:6px; width:100%; max-width:400px; min-width:0; min-height:0; color:var(--text); }
  html[data-surface="board"] .wp { max-width:none; justify-content:center; }
  /* The page is drawn at a desktop width (1280x800), then scaled to the card width by --wp-s / --wp-h. */
  .wp-shot { position:relative; display:block; flex:0 1 auto; width:100%; height:min(var(--wp-h, 150px), 150px); min-height:0; overflow:hidden; background:#FFFFFF; border:1px solid var(--line); border-radius:8px; cursor:pointer; }
  html[data-surface="board"] .wp-shot { height:var(--wp-h, 150px); }
  .wp-shot:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  .wp-shot iframe { position:absolute; top:0; left:0; width:1280px; height:800px; border:0; background:#FFFFFF; transform-origin:0 0; transform:scale(var(--wp-s, 0.1)); pointer-events:none; }
  .wp-empty { flex:none; display:flex; align-items:center; justify-content:center; min-height:56px; padding:0 14px; border:1px solid var(--line); border-radius:8px; background:var(--code); color:var(--muted); font-size:12px; text-align:center; overflow-wrap:anywhere; }
  .wp-foot { flex:none; display:flex; align-items:center; gap:8px; min-width:0; }
  .wp-title { flex:1; min-width:0; font-size:13px; font-weight:600; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wp-open { flex:none; min-height:44px; padding:0 12px; }
</style>
<div id="app"></div>
<script>
const { html, render, useState, useEffect, useLayoutEffect, useRef, Card, Button } = ccb.kit;

const PAGE_W = 1280, PAGE_H = 800;

function Preview({ raw }) {
  // Same reading as before: anything that is not an object has none of the fields.
  const d = raw && typeof raw === 'object' ? raw : {};
  const title = d.title || d.name || 'Web preview';
  const canOpen = !!d.url && !d.missing;
  const hasPreview = !!d.src && !d.missing;
  const open = () => { if (canOpen) ccb.open(d.url, title); };
  const shot = useRef(null);

  // Scale the desktop-width page to the frame's width; the frame's real size drives it, so a Board resize
  // (also while dragging) refits without a redraw.
  useLayoutEffect(() => {
    const el = shot.current;
    if (!hasPreview || !el) return undefined;
    const fit = () => {
      const scale = el.clientWidth / PAGE_W;
      if (!scale) return;
      el.style.setProperty('--wp-s', String(scale));
      el.style.setProperty('--wp-h', Math.round(PAGE_H * scale) + 'px');
    };
    fit();
    const ro = new ResizeObserver(fit);
    ro.observe(el);
    return () => ro.disconnect();
  }, [hasPreview]);

  const onKey = (event) => {
    if (event.isComposing) return;
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); open(); }
  };

  return html`<div class="wp">
    ${hasPreview
      ? html`<div class="wp-shot" ref=${shot} tabindex="0" role="button" aria-label=${'Open full page: ' + title} onClick=${open} onKeyDown=${onKey}>
          <iframe sandbox="allow-scripts" src=${d.src} aria-hidden="true" tabindex="-1"></iframe>
        </div>`
      : html`<div class="wp-empty">${d.missing ? 'File not found' : 'This page cannot be previewed'}</div>`}
    <div class="wp-foot">
      <div class="wp-title" title=${d.name && d.name !== title ? d.name : undefined}>${title}</div>
      <${Button} class="wp-open" aria-label=${'Open full page: ' + title} disabled=${!canOpen} onClick=${open}>Open<//>
    </div>
  </div>`;
}

// One count per data event (ccb.onData: also a refresh or a re-sent identical value). The preview starts over
// for each one (the page reloads in a new frame), the way the old frame redraw did. useData() is not used: it
// only redraws when the value changes, and ccb.onData must not be called next to it.
function useDataEvents() {
  const [s, setS] = useState(() => ({ raw: ccb.data !== undefined ? ccb.data : null, n: 1 }));
  useEffect(() => (ccb.onData ? ccb.onData((nd) => setS((x) => ({ raw: nd !== undefined ? nd : ccb.data, n: x.n + 1 }))) : undefined), []);
  return s;
}

function App() {
  const ev = useDataEvents();
  return html`<${Card} class="wp-card"><${Preview} key=${ev.n} raw=${ev.raw} /><//>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
